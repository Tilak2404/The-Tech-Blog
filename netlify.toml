functionsDirectory = "/opt/build/repo/netlify/functions"
functionsDirectoryOrigin = "config-v1"
redirectsOrigin = "config"
plugins = []
headers = []

[build]
publish = "/opt/build/repo/public"
publishOrigin = "config"
commandOrigin = "config"
command = "mkdir -p public/static && cp -r Thetechblog/static/* public/static/"
functions = "/opt/build/repo/netlify/functions"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions."*"]
  included_files = [
    "Thetechblog/**"
  ]

[[redirects]]
from = "/static/*"
to = "/static/:splat"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/*"
to = "/.netlify/functions/app"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]